<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>第五人格 好き顔ソート</title>
<style>
:root{--bg:#fff7fb;--card:#fff;--pink:#ff6fae;--text:#332b31;--muted:#8d7f87}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;background:linear-gradient(145deg,#fff7fb,#f5f0ff);color:var(--text)}
main{max-width:760px;margin:auto;padding:28px 16px 48px}.hero{text-align:center;padding:22px 0 16px}
.badge{display:inline-block;background:#fff;border:1px solid #f5d7e6;border-radius:999px;padding:6px 12px;font-size:12px;color:#b85a83}
h1{font-size:clamp(28px,8vw,46px);margin:12px 0 6px;letter-spacing:.03em}.sub{color:var(--muted);margin:0 0 22px}
.progress{height:8px;background:#eadfe6;border-radius:99px;overflow:hidden}.bar{height:100%;background:linear-gradient(90deg,#ff78b3,#b48cff);width:0%;transition:.35s}
.status{text-align:center;color:var(--muted);font-size:13px;margin:9px 0 18px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px}
.card{border:2px solid transparent;background:var(--card);border-radius:22px;padding:10px;box-shadow:0 8px 28px #6b496015;cursor:pointer;transition:.18s;min-width:0;text-align:center;position:relative}
.card.selected{border-color:var(--pink);background:#fff0f6}
.card:active{transform:scale(.97)}
.photo{aspect-ratio:4/5;border-radius:16px;background:linear-gradient(135deg,#f3e8ef,#eee9f7);display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}
.photo img{width:100%;height:100%;object-fit:cover}
.name{font-weight:800;font-size:15px;margin:8px 2px 2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.team{font-size:11px;color:var(--muted);margin:0 2px 4px}
.choose{font-size:12px;color:var(--pink);font-weight:700;margin:6px 2px 2px}
.checkbox-badge{position:absolute;top:8px;right:8px;background:#fff;border:1px solid #ddd;border-radius:50%;width:22px;height:22px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:bold}
.card.selected .checkbox-badge{background:var(--pink);color:#fff;border-color:var(--pink)}

.btn-area{display:flex;justify-content:center;gap:12px;margin-top:24px;flex-wrap:wrap}
button{border:0;border-radius:999px;padding:12px 24px;background:linear-gradient(90deg,#ff78b3,#b48cff);color:#fff;font-weight:800;font-size:14px;cursor:pointer;box-shadow:0 4px 14px #ff78b340;transition:.2s}
button:hover{opacity:.9;transform:translateY(-1px)}
button.btn-back{background:#eee6ed;color:#6b5a65;box-shadow:none}

/* 結果画面：3×3 グリッドスタイル */
#result{display:none}
.ranking-3x3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px}
.rank-card{background:#fff;border-radius:18px;padding:8px;box-shadow:0 5px 18px #6b496012;text-align:center;position:relative;overflow:hidden}
.rank-badge{position:absolute;top:12px;left:12px;background:var(--pink);color:#fff;font-weight:900;font-size:12px;width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;z-index:2;box-shadow:0 2px 6px rgba(0,0,0,0.15)}
.rank-card:nth-child(1) .rank-badge{background:#ffd700;color:#5a4300}
.rank-card:nth-child(2) .rank-badge{background:#c0c0c0;color:#333}
.rank-card:nth-child(3) .rank-badge{background:#c4723e;color:#fff}
.rphoto{aspect-ratio:4/5;border-radius:12px;background:#eee6ed;overflow:hidden;margin-bottom:6px}
.rphoto img{width:100%;height:100%;object-fit:cover}
.rname{font-weight:800;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rteam{font-size:10px;color:var(--muted)}

.note{text-align:center;color:#9a8d95;font-size:11px;line-height:1.6;margin-top:22px}
</style>
</head>
<body>

<!-- パスワード入力画面 -->
<div id="auth-screen" style="max-width:360px; margin:80px auto; padding:28px 20px; background:#fff; border-radius:24px; box-shadow:0 8px 28px #6b496015; text-align:center;">
  <h2 style="font-size:18px; margin:0 0 8px; color:var(--text);">🔒 パスワードが必要です</h2>
  <p style="font-size:12px; color:var(--muted); margin:0 0 20px;">合言葉を入力してログインしてください</p>
  <input type="password" id="pass-input" placeholder="パスワード" style="width:100%; padding:12px; border:2px solid #f5d7e6; border-radius:12px; font-size:16px; margin-bottom:16px; text-align:center; outline:none;">
  <button onclick="checkPassword()" style="width:100%;">入室する</button>
  <p id="pass-error" style="color:#ff5a79; font-size:12px; margin:12px 0 0; display:none;">※パスワードが違います</p>
</div>

<!-- メインコンテンツ（最初は非表示） -->
<main id="main-content" style="display:none;">
<section id="game">
<div class="hero">
  <span class="badge" id="phase-badge">予選</span>
  <h1 id="title-text">第五選手好き顔９選♡</h1>
  <p class="sub" id="sub-text">グループの中から推せる選手を選択（0〜5人何人でもOK）</p>
</div>
<div class="progress"><div class="bar" id="bar"></div></div>
<div class="status" id="status"></div>
<div class="grid" id="grid"></div>
<div class="btn-area" id="btn-area"></div>
</section>

<section id="result">
<div class="hero"><span class="badge">RESULT</span><h1>あなたの好き顔 TOP9</h1><p class="sub"></p></div>
<div id="ranking" class="ranking-3x3"></div>
<div style="text-align:center;margin-top:28px;"><button onclick="location.reload()">もう一度遊ぶ</button></div>
</section>
<p class="note">※使いづらくてごめん。</p>
</main>

<script>
// ▼ 友達に教えるパスワード（ここを自由に変更してください）
const SECRET_PASS = "namake";

function checkPassword() {
  const input = document.getElementById("pass-input").value;
  if (input === SECRET_PASS) {
    document.getElementById("auth-screen").style.display = "none";
    document.getElementById("main-content").style.display = "block";
  } else {
    document.getElementById("pass-error").style.display = "block";
  }
}

const players = [
  ["mone","SCARZ","mone.jpg"], ["yora","SCARZ","yora.jpg"], ["Alphar","ZETA DIVISION","Alphar.jpg"],
  ["tarako","SCARZ","tarako.jpg"], ["4ta5","SCARZ","4ta5.jpg"], ["DoLisu","ZETA DIVISION","DoLisu.jpg"],
  ["Hametu","ZETA DIVISION","Hametu.jpg"], ["Shinami","ZETA DIVISION","Shinami.webp"], ["Rose","ZETA DIVISION","Rose.jpg"],
  ["mkmldy","ZETA DIVISION","mkmldy.webp"], ["MiraiK","ZETA DIVISION","MiraiK.jpg"], ["Silk","ZETA DIVISION","Silk.jpg"],
  ["Burio","SCARZ","Burio.jpg"], ["Latty","SCARZ","Latty.jpg"], ["Unpyi","REJECT","unpyi.jpg"],
  ["Yougg","REJECT","yougg.jpg"], ["City","REJECT","city.jpg"], ["Alf","REJECT","alf.jpg"],
  ["AKa","REJECT","aka.jpg"], ["Hhu","REJECT","hhu.jpg"], ["Fuku","REJECT","fuku.jpg"],
  ["Kznk","ZETA DIVISION","Kznk.jpg"], ["Maekenn","FENNEL","Maekenn.png"], ["Moririn","FENNEL","Moririn.png"],
  ["Hasha","FENNEL","Hasha.png"], ["Kat","FENNEL","Kat.png"], ["noNino","FENNEL","noNino.png"],
  ["PiPiCha","FENNEL","PiPiCha.png"], ["gnk","SCARZ","gnk.jpg"], ["Katsuki","FENNEL","Katsuki.png"],
  ["Sasori","FENNEL","Sasori.png"], ["Felix","DFM","felix.png"], ["Appai","DFM","appai.png"],
  ["Vani","DFM","vani.png"], ["Takoyaki","DFM","takoyaki.png"], ["Amand","AWG","amand.jpg"],
  ["mzk","DFM","mzk.png"], ["Yami","DFM","yami.png"], ["Kokua","DFM","kokua.png"],
  ["Pendk","QTD","Pendk.png"], ["Terad","QTD","Terad.png"], ["Kotami","QTD","Kotami.png"],
  ["Irohasu","QTD","Irohasu.png"], ["zizi","QTD","zizi.png"], ["Myme","QTD","Myme.png"],
  ["yomi1","QTD","yomi1.png"], ["Aez","AWG","Aez.png"], ["batoru","AWG","batoru.png"],
  ["Nameko","AWG","Nameko.png"], ["Emmko","AWG","Emmko.png"], ["yukakina","AWG","yukakina.png"],
  ["yun","AWG","yun.png"], ["Scorpion","AWG","Scorpion.png"], ["Toki","AXIZ","Toki.webp"],
  ["Nyan","AXIZ","Nyan.jpg"], ["Takakou","AXIZ","Takakou.jpg"], ["Atto","AXIZ","Atto.jpg"],
  ["KaKaKa","AXIZ","KaKaKa.jpg"], ["monoP","AXIZ","monoP.jpg"], ["Kakiri","AXIZ","Kakiri.jpg"]
];

let prelimGroups = [];
let prelimCurrent = 0;
let selectedWinners = new Set();

let mainMatches = [];
let mainCurrent = 0;
let mainWins = {};
let mainHistory = [];

function init() {
  let pool = [...players].sort(() => Math.random() - .5);
  for(let i = 0; i < pool.length; i += 5) {
    prelimGroups.push(pool.slice(i, i + 5));
  }
  renderPrelim();
}

function renderPrelim() {
  const group = prelimGroups[prelimCurrent];
  document.getElementById("phase-badge").textContent = "予選";
  document.getElementById("sub-text").textContent = "気になった選手を自由にチェック（0〜5人選択可）";
  document.getElementById("status").textContent = `予選 第 ${prelimCurrent + 1} / ${prelimGroups.length} グループ`;
  document.getElementById("bar").style.width = (prelimCurrent / prelimGroups.length * 100) + "%";

  const grid = document.getElementById("grid");
  grid.style.gridTemplateColumns = "repeat(auto-fit, minmax(120px, 1fr))";
  
  grid.innerHTML = group.map((p) => {
    const isSelected = selectedWinners.has(p[0]);
    return `
      <div class="card ${isSelected ? 'selected' : ''}" onclick="toggleSelect('${p[0]}')">
        <div class="checkbox-badge">${isSelected ? '✓' : ''}</div>
        <div class="photo"><img src="${p[2]}" alt="${p[0]}"></div>
        <div class="name">${p[0]}</div>
        <div class="team">${p[1]}</div>
      </div>
    `;
  }).join("");

  let btnHTML = "";
  if (prelimCurrent > 0) {
    btnHTML += `<button class="btn-back" onclick="prevPrelimGroup()">← 前のグループへ</button>`;
  }
  btnHTML += `<button onclick="nextPrelimGroup()">次へ →</button>`;
  
  document.getElementById("btn-area").innerHTML = btnHTML;
}

function toggleSelect(name) {
  if (selectedWinners.has(name)) {
    selectedWinners.delete(name);
  } else {
    selectedWinners.add(name);
  }
  renderPrelim();
}

function prevPrelimGroup() {
  if (prelimCurrent > 0) {
    prelimCurrent--;
    renderPrelim();
  }
}

function nextPrelimGroup() {
  prelimCurrent++;
  if (prelimCurrent < prelimGroups.length) {
    renderPrelim();
  } else {
    startMainTournament();
  }
}

function startMainTournament() {
  let winners = players.filter(p => selectedWinners.has(p[0]));
  
  if (winners.length < 2) {
    let pool = players.filter(p => !selectedWinners.has(p[0])).sort(() => Math.random() - .5);
    while (winners.length < 4 && pool.length > 0) {
      winners.push(pool.shift());
    }
  }

  mainMatches = [];
  mainWins = {};
  mainHistory = [];
  mainCurrent = 0;

  winners.forEach(p => mainWins[p[0]] = 0);

  for (let i = 0; i < winners.length; i++) {
    for (let j = i + 1; j < winners.length; j++) {
      mainMatches.push([winners[i], winners[j]]);
    }
  }
  mainMatches.sort(() => Math.random() - .5);

  renderMain();
}

function renderMain() {
  const match = mainMatches[mainCurrent];
  document.getElementById("phase-badge").textContent = "本戦";
  document.getElementById("sub-text").textContent = "より好きな顔の選手を1人選んでね！";
  document.getElementById("status").textContent = `本戦 第 ${mainCurrent + 1} / ${mainMatches.length} 試合`;
  document.getElementById("bar").style.width = (mainCurrent / mainMatches.length * 100) + "%";

  const grid = document.getElementById("grid");
  grid.style.gridTemplateColumns = "repeat(2, 1fr)";
  
  grid.innerHTML = match.map((p) => `
    <div class="card" onclick="pickMain('${p[0]}')">
      <div class="photo"><img src="${p[2]}" alt="${p[0]}"></div>
      <div class="name">${p[0]}</div>
      <div class="team">${p[1]}</div>
      <div class="choose">この顔が好き♡</div>
    </div>
  `).join("");

  let btnHTML = "";
  if (mainCurrent > 0) {
    btnHTML += `<button class="btn-back" onclick="prevMain()">← 前の試合へ戻る</button>`;
  }
  document.getElementById("btn-area").innerHTML = btnHTML;
}

function pickMain(winnerName) {
  mainWins[winnerName]++;
  mainHistory.push(winnerName);
  mainCurrent++;

  if (mainCurrent < mainMatches.length) {
    renderMain();
  } else {
    showResult();
  }
}

function prevMain() {
  if (mainCurrent > 0) {
    mainCurrent--;
    const lastWinner = mainHistory.pop();
    if (lastWinner) {
      mainWins[lastWinner]--;
    }
    renderMain();
  }
}

function showResult() {
  document.getElementById("game").style.display = "none";
  document.getElementById("result").style.display = "block";

  let winners = players.filter(p => selectedWinners.has(p[0]));
  if (winners.length < 2) {
    winners = players.filter(p => mainWins[p[0]] !== undefined);
  }
  winners.sort((a, b) => (mainWins[b[0]] || 0) - (mainWins[a[0]] || 0));

  if (winners.length < 9) {
    let rest = players.filter(p => !winners.some(w => w[0] === p[0])).sort(() => Math.random() - .5);
    winners = winners.concat(rest.slice(0, 9 - winners.length));
  }

  const top9 = winners.slice(0, 9);

  document.getElementById("ranking").innerHTML = top9.map((p, i) => `
    <div class="rank-card">
      <div class="rank-badge">${i + 1}</div>
      <div class="rphoto"><img src="${p[2]}" alt="${p[0]}"></div>
      <div class="rname">${p[0]}</div>
      <div class="rteam">${p[1]}</div>
    </div>
  `).join("");
}

init();
</script>
</body>
</html>
